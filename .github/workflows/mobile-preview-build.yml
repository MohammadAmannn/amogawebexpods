name: Mobile Preview Build (Android & iOS)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/mobile-preview-build.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        required: true
        default: 'android'
        options:
          - 'android'
          - 'ios'
          - 'all'

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android Preview APK
    if: github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Quality Checks
        run: |
          pnpm --dir apps/mobile typecheck
          pnpm --dir apps/mobile lint

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android Preview APK on Runner
        working-directory: apps/mobile
        env:
          EAS_PROJECT_ID: 'cf8a18cd-d1e9-41f3-9f42-9c3967557724'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          eas build --platform android --profile preview --local --output=./amoga-preview.apk --non-interactive

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amoga-android-preview-apk
          path: apps/mobile/amoga-preview.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS Preview App
    if: github.event_name == 'push' || inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1+
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          fi
          xcodebuild -version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Quality Checks
        run: |
          pnpm --dir apps/mobile typecheck
          pnpm --dir apps/mobile lint

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS Preview on Runner
        working-directory: apps/mobile
        env:
          EAS_PROJECT_ID: 'cf8a18cd-d1e9-41f3-9f42-9c3967557724'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          eas build --platform ios --profile preview --local --output=./amoga-preview.tar.gz --non-interactive

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amoga-ios-preview-build
          path: apps/mobile/amoga-preview.tar.gz
          if-no-files-found: error
          retention-days: 30
